<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · MARK-TREND</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbfaf8;--ink:#111827;--muted:#667085;--violet:#7a5af5;--violetSoft:#f1edff}
*{box-sizing:border-box;margin:0}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column}
.header{position:fixed;top:0;left:0;right:0;z-index:100;height:86px;background:rgba(251,250,248,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 42px;border-bottom:1px solid rgba(17,24,39,.06)}
.brand img{width:200px;height:auto}
.nav{display:flex;align-items:center;gap:32px;font-size:15px;font-weight:500}
.nav a{color:var(--ink);text-decoration:none;transition:color .2s}
.nav a:hover{color:var(--violet)}
.cta{background:var(--ink);color:#fff!important;padding:10px 22px;border-radius:99px;font-size:14px}
.cta:hover{background:var(--violet)!important}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 60px;gap:20px}
.code{font-size:120px;font-weight:800;letter-spacing:-4px;color:var(--violet);opacity:.18;line-height:1}
h1{font-size:36px;font-weight:700;letter-spacing:-1px}
.sub{font-size:17px;color:var(--muted);max-width:440px;line-height:1.6}
.btn{display:inline-block;margin-top:12px;background:var(--ink);color:#fff;padding:14px 32px;border-radius:99px;text-decoration:none;font-size:15px;font-weight:600;transition:background .2s}
.btn:hover{background:var(--violet)}
.footer{text-align:center;padding:24px;font-size:12px;color:var(--muted);border-top:1px solid rgba(17,24,39,.06)}
@media(max-width:760px){.header{height:76px;padding:0 16px}.brand img{width:170px}.nav a:not(.cta){display:none}.code{font-size:80px}h1{font-size:28px}.sub{font-size:15px}}
</style>
</head>
<body>
<header class="header">
<a class="brand" href="https://marktrend.com.ar/"><img src="/images/logo-marktrend.webp" alt="MARK-TREND"></a>
<nav class="nav">
<a href="https://marktrend.com.ar/biblioteca">Biblioteca</a>
<a href="https://marktrend.com.ar/faq">Preguntas</a>
<a class="cta" href="https://marktrend.com.ar/contacto">Hablemos →</a>
</nav>
</header>
<div class="wrap">
<div class="code">404</div>
<h1>Esta página no existe</h1>
<p class="sub">Puede que el enlace esté roto o que la dirección haya cambiado. Si necesitás ayuda, escribinos.</p>
<a class="btn" href="https://marktrend.com.ar/">Volver al inicio</a>
</div>
<footer class="footer">© 2026 MARK-TREND · Sistemas digitales para negocios reales</footer>
</body>
</html>
